{% extends "base.html" %}
{% block title %}Login — AI Career Coach{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card animate-on-scroll">
    <div class="text-center mb-4">
      <i class="bi bi-compass-fill display-5 text-gradient"></i>
      <h3 class="fw-bold mt-2">Welcome Back</h3>
      <p class="text-muted">Login to continue your career journey</p>
    </div>
    <form method="POST" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="remember" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary-custom w-100">Login</button>
    </form>
    <p class="text-center mt-4 mb-0 text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none">Register</a></p>
  </div>
</div>
{% endblock %}
